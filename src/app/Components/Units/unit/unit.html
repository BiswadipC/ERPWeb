<div class="container-fluid px-4 py-4">

  <!-- Page Header -->
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">

    <div>
      <h2 class="fw-bold mb-1">Unit Master</h2>
      <p class="text-muted mb-0">
        Manage units used throughout the system
      </p>
    </div>

    <div class="mt-3 mt-md-0">
      <a [routerLink]="['/add-edit-unit', 0]"
         class="btn btn-primary px-4">
        <i class="bi bi-plus-lg me-2"></i>
        Add New Unit
      </a>
    </div>

  </div>


  <!-- Main Card -->
  <div class="card border-0 shadow-sm">

    <!-- Card Header -->
    <div class="card-header bg-white border-bottom py-3">

      <div class="row align-items-center">

        <div class="col-md-6">
          <h5 class="mb-0 fw-semibold">
            Unit List
          </h5>
        </div>

        <div class="col-md-6 mt-3 mt-md-0">
          <div class="input-group">

            <span class="input-group-text bg-light border-end-0">
              <i class="bi bi-search"></i>
            </span>

            <input type="text"
                   class="form-control bg-light border-start-0"
                   placeholder="Search units...">

          </div>
        </div>

      </div>

    </div>


    <!-- Table -->
    <div class="card-body p-0">

      <div class="table-responsive">

        <table class="table table-hover align-middle mb-0">

          <thead class="table-light">

            <tr>
              <th class="ps-4" style="width: 120px;">
                Unit ID
              </th>

              <th>
                Unit Name
              </th>

              <th class="text-end pe-4" style="width: 160px;">
                Actions
              </th>
            </tr>

          </thead>


          <tbody>

            @for(m of units; track m.IdNo)
            {
              <tr>

                <td class="ps-4">
                  <span class="badge bg-light text-dark border">
                    {{m.IdNo}}
                  </span>
                </td>

                <td>
                  <span class="fw-medium">
                    {{m.Name}}
                  </span>
                </td>

                <td class="text-end pe-4">

                  <a [routerLink]="['/add-edit-unit', m.IdNo]"
                     class="btn btn-sm btn-outline-primary me-2">
                    <i class="bi bi-pencil"></i>
                  </a>

                </td>

              </tr>
            }

            @if(units.length === 0)
            {
              <tr>
                <td colspan="3" class="text-center py-5">

                  <div class="text-muted">

                    <i class="bi bi-inbox fs-1 d-block mb-3"></i>

                    <h6 class="fw-semibold">
                      No units found
                    </h6>

                    <p class="mb-0">
                      Click "Add New Unit" to create your first unit.
                    </p>

                  </div>

                </td>
              </tr>
            }

          </tbody>

        </table>

      </div>

    </div>


    <!-- Card Footer -->
    <div class="card-footer bg-white border-top py-3">

      <div class="d-flex justify-content-between align-items-center">

        <small class="text-muted">
          Total Units: <strong>{{units.length}}</strong>
        </small>

      </div>

    </div>

  </div>

</div>
