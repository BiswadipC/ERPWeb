<div class="container">
  <div class="row">
    <div class="col-12">
      <h2 class="text-center">List Of Items</h2>
    </div>
  </div>
  <div class="row">
    <div class="col-6">
      <a [routerLink]="['/add-edit-item',0]" class="btn btn-primary">Add New Item</a>
    </div>
  </div>
  <br/>
  <div class="row">
    <div class="col-12">
      <table class="table table-striped table-bordered">
        <thead>
          <tr>
            <th>ItemId</th>
            <th>Item Name</th>
            <th>UnitId</th>
            <th>Unit Name</th>
            <th>MRP</th>
            <th>ReOrder-Level</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          @for(item of items; track item.ItemId)
          {
            <tr>
              <td>{{item.ItemId}}</td>
              <td>{{item.ItemName}}</td>
              <td>{{item.UnitId}}</td>
              <td>{{item.UnitName}}</td>
              <td>{{item.MRP}}</td>
              <td>{{item.ReorderLevel}}</td>
              <td><a [routerLink]="['/add-edit-item', item.ItemId]">Edit</a></td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
